name: flutter_core_base
description: "A production-grade modern Flutter base project using Riverpod Generator and Feature-First Clean Architecture."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Declarative Routing
  go_router: ^17.5.0

  # Networking & HTTP Client
  dio: ^5.8.0+1

  # Functional Programming & Result Types
  fpdart: ^1.1.1

  # Immutability & Model Serialization Annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Local Persistence & Storage
  shared_preferences: ^2.5.5

  # Animation & UI Helpers
  flutter_animate: ^4.5.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.9.4

  # Testing & Mocking
  mocktail: ^1.0.4

  # Linter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: dev
  uses-material-design: true
  generate: true
