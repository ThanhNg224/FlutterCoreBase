name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Verify and test with coverage
        run: make ci

      - name: Verify dart-define wiring in both directions
        run: |
          flutter test --dart-define=APP_ENV=dev test/core/config/app_environment_test.dart
          flutter test --dart-define=APP_ENV=prod test/core/config/app_environment_test.dart
